<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Tackline: sign in</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#14181c;color:#e8edf0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
form{width:min(340px,100%);display:flex;flex-direction:column;gap:12px}
h1{margin:0 0 4px;font-size:22px}
label{color:#aab4bb;font-size:14px}
input{padding:11px 12px;font-size:17px;border-radius:6px;border:1px solid #475058;background:#0d1013;color:#e8edf0}
input:focus-visible,button:focus-visible{outline:2px solid #ffc83d;outline-offset:2px}
button{padding:11px 12px;font-size:16px;font-weight:600;border:0;border-radius:6px;background:#ffc83d;color:#1a1400;cursor:pointer}
#err{min-height:1.3em;color:#ff8c8c;font-size:14px}
</style></head><body>
<form id="f" autocomplete="off">
<h1>Tackline</h1>
<label for="p">Enter the password to continue</label>
<input id="p" type="password" inputmode="text" autocomplete="off" autofocus>
<button type="submit">Open Tackline</button>
<div id="err" role="alert"></div>
</form>
<script>
/* Sign-in page. The password is the current time in Toronto, so it is never written in this file.
   Accepted: 24-hour or 12-hour time, with or without a leading zero; colon and am/pm are optional
   (6:30 PM -> 630, 0630, 1830). One minute either side also works. */
(function(){
 var TARGET='tackline.html';
 function torontoHM(d){var f=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Toronto',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);
  function g(t){return +f.filter(function(x){return x.type===t})[0].value}
  return[g('hour')%24,g('minute')]}
 function okPass(txt,now){
  var digits=String(txt||'').replace(/\D/g,'');if(digits.length<3||digits.length>4)return false;
  var offs=[-60000,0,60000];
  for(var i=0;i<offs.length;i++){
   var hm=torontoHM(new Date(now.getTime()+offs[i])),h=hm[0],mm=('0'+hm[1]).slice(-2),h12=h%12===0?12:h%12;
   var ok=[('0'+h).slice(-2)+mm,String(h)+mm,('0'+h12).slice(-2)+mm,String(h12)+mm];
   if(ok.indexOf(digits)>=0)return true;
  }
  return false;
 }
 window.__okPass=okPass;
 function go(){location.replace(TARGET)}
 try{if(sessionStorage.getItem('tackOK')==='1'){go();return}}catch(e){}
 var P=document.getElementById('p'),E=document.getElementById('err');
 document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  if(okPass(P.value,new Date())){try{sessionStorage.setItem('tackOK','1')}catch(x){}go();return}
  E.textContent='That password is not right.';P.value='';P.focus();
 });
})();
</script>
</body></html>
